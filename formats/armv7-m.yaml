    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); setflags = (S == '1');
      (imm32, carry) = ThumbExpandImm_C(i:imm3:imm8, APSR.C);
      if d IN {13,15} then UNPREDICTABLE;
  - name: T3
    length_bits: 32
    pattern: 11110x100100xxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
