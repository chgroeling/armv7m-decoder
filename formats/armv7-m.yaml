  - name: T3
    length_bits: 32
    pattern: 11101010010x11110000xxxx0000xxxx
    bit_fields:
    - skip: 11
    - field: S
      width: 1
    - skip: 4
    - skip: 1
    - skip: 3
    - field: Rd
      width: 4
    - skip: 4
    - field: Rm
      width: 4
    decode: |
      d = UInt(Rd); m = UInt(Rm); setflags = (S == '1');
      if setflags && (d IN {13,15} || m IN {13,15}) then UNPREDICTABLE;
      if !setflags && (d == 15 || m == 15 || (d == 13 && m == 13)) then UNPREDICTABLE;
- id: NOP
  mnemonic: NOP
  encodings:
  - name: T1
    length_bits: 16
    pattern: '1011111100000000'
    bit_fields:
    - skip: 16
    decode: |
      // No additional decoding required
  - name: T2
    length_bits: 32
    pattern: '11110011101011111000000000000000'
    bit_fields:
    - skip: 12
    - skip: 1
    - skip: 1
    - skip: 1
    - skip: 1
    - skip: 2
    - skip: 1
    - skip: 1
    - skip: 1
    - skip: 11
    decode: |
      // No additional decoding required
- id: LDR_immediate
  mnemonic: LDR
  encodings:
  - name: T1
    length_bits: 16
    pattern: 01101xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: imm5
      width: 5
    - field: Rn
      width: 3
    - field: Rt
      width: 3
    decode: |
      t = UInt(Rt); n = UInt(Rn); imm32 = ZeroExtend(imm5:'00', 32);
      index = TRUE; add = TRUE; wback = FALSE;
  - name: T2
    length_bits: 16
    pattern: 10011xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rt
      width: 3
    - field: imm8
      width: 8
    decode: |
      t = UInt(Rt); n = 13; imm32 = ZeroExtend(imm8:'00', 32);
      index = TRUE; add = TRUE; wback = FALSE;
  - name: T3
    length_bits: 32
    pattern: 111110001101xxxxxxxxxxxxxxxxxxxx
    bit_fields:
    - skip: 12
    - field: Rn
      width: 4
    - field: Rt
      width: 4
    - field: imm12
      width: 12
    decode: |
      if Rn == '1111' then SEE LDR (literal);
      t = UInt(Rt); n = UInt(Rn); imm32 = ZeroExtend(imm12, 32);
      index = TRUE; add = TRUE; wback = FALSE;
      if t == 15 && InITBlock() && !LastInITBlock() then UNPREDICTABLE;
  - name: T4
    length_bits: 32
    pattern: 111110000101xxxxxxxx1xxxxxxxxxxx
    bit_fields:
    - skip: 12
    - field: Rn
      width: 4
    - field: Rt
      width: 4
    - skip: 1
    - field: P
      width: 1
    - field: U
      width: 1
    - field: W
      width: 1
    - field: imm8
      width: 8
    decode: |
      if Rn == '1111' then SEE LDR (literal);
      if P == '1' && U == '1' && W == '0' then SEE LDRT;
      if Rn == '1101' && P == '0' && U == '1' && W == '1' && imm8 == '00000100' then SEE POP;
      if P == '0' && W == '0' then UNDEFINED;
      t = UInt(Rt); n = UInt(Rn); imm32 = ZeroExtend(imm8, 32);
      index = (P == '1'); add = (U == '1'); wback = (W == '1');
      if (wback && n == t) || (t == 15 && InITBlock() && !LastInITBlock()) then UNPREDICTABLE;
- id: LDR_literal
  mnemonic: LDR
