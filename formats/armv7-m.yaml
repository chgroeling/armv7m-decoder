- id: MOV_immediate
  mnemonic: MOV
  encodings:
  - name: T1
    length_bits: 16
    pattern: 00100xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rd
      width: 3
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); setflags = !InITBlock();
      imm32 = ZeroExtend(imm8, 32); carry = APSR.C;
  - name: T2
    length_bits: 32
    pattern: 11110x00010x11110xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 5
    - field: S
