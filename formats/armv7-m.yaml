- id: VRINTA_VRINTN_VRINTP_VRINTM
  mnemonic: VRINTA
  encodings:
  - name: T1
    length_bits: 32
    pattern: 111111101x1110xxxxxx101x01x0xxxx
    bit_fields:
    - skip: 9
    - field: D
      width: 1
    - skip: 4
    - field: RM
      width: 2
    - field: Vd
      width: 4
    - skip: 3
    - field: sz
      width: 1
    - skip: 2
    - field: M
      width: 1
    - skip: 1
    - field: Vm
      width: 4
    decode: |
      if InITBlock() then UNPREDICTABLE;
      dp_operation = (sz == '1');
      case RM
          when '00' // Round to nearest, with ties away
              rmode = '01'; away = TRUE;
          when '01' // Round to nearest, with ties to even
              rmode = '00'; away = FALSE;
          when '10' // Round towards Plus Infinity
              rmode = '01'; away = FALSE;
          when '11' // Round towards Minus Infinity
              rmode = '10'; away = FALSE;
      d = if dp_operation then UInt(D:Vd) else UInt(Vd:D);
      m = if dp_operation then UInt(M:Vm) else UInt(Vm:M);
