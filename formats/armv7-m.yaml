metadata:
  architecture: ARMv7-M
  instruction_set: Thumb
  source_manual: Armv7-M Architecture Reference Manual
  source_id: ARM DDI 0403E.e
  note: 'Decode-only extract: walk bit_fields MSB→LSB — skip N bits for `skip` entries, extract field
    values for `field` entries. The pattern string shows the full bit layout (''0''/''1'' for fixed, ''x''
    for variable). Should-be-0/1 bits are included as fixed ''0''/''1'', so matching is strict.'
instructions:
- id: ADC_immediate
  mnemonic: ADC
  encodings:
  - name: T1
    length_bits: 32
    pattern: 11110x01010xxxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 5
    - field: S
      width: 1
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); n = UInt(Rn); setflags = (S == '1');
      imm32 = ThumbExpandImm(i:imm3:imm8);
      if d IN {13,15} || n IN {13,15} then UNPREDICTABLE;
- id: ADC_register
  mnemonic: ADC
  encodings:
  - name: T1
    length_bits: 16
    pattern: 0100000101xxxxxx
    bit_fields:
    - skip: 10
    - field: Rm
      width: 3
    - field: Rdn
      width: 3
    decode: |
      d = UInt(Rdn); n = UInt(Rdn); m = UInt(Rm); setflags = !InITBlock();
      (shift_t, shift_n) = (SRType_LSL, 0);
  - name: T2
    length_bits: 32
    pattern: 11101011010xxxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 11
    - field: S
      width: 1
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm2
      width: 2
    - field: type
      width: 2
    - field: Rm
      width: 4
    decode: |
      d = UInt(Rd); n = UInt(Rn); m = UInt(Rm); setflags = (S == '1');
      (shift_t, shift_n) = DecodeImmShift(type, imm3:imm2);
      if d IN {13,15} || n IN {13,15} || m IN {13,15} then UNPREDICTABLE;
- id: ADD_immediate
  mnemonic: ADD
  encodings:
  - name: T1
    length_bits: 16
    pattern: 0001110xxxxxxxxx
    bit_fields:
    - skip: 7
    - field: imm3
      width: 3
    - field: Rn
      width: 3
    - field: Rd
      width: 3
    decode: |
      d = UInt(Rd); n = UInt(Rn); setflags = !InITBlock();
      imm32 = ZeroExtend(imm3, 32);
  - name: T2
    length_bits: 16
    pattern: 00110xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rdn
      width: 3
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rdn); n = UInt(Rdn); setflags = !InITBlock();
      imm32 = ZeroExtend(imm8, 32);
  - name: T3
    length_bits: 32
    pattern: 11110x01000xxxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 5
    - field: S
      width: 1
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      if Rd == '1111' && S == '1' then SEE CMN (immediate);
      if Rn == '1101' then SEE ADD (SP plus immediate);
      d = UInt(Rd); n = UInt(Rn); setflags = (S == '1');
      imm32 = ThumbExpandImm(i:imm3:imm8);
      if d == 13 || (d == 15 && S == '0') || n == 15 then UNPREDICTABLE;
  - name: T4
    length_bits: 32
    pattern: 11110x100000xxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 6
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      if Rn == '1111' then SEE ADR;
      if Rn == '1101' then SEE ADD (SP plus immediate);
      d = UInt(Rd); n = UInt(Rn); setflags = FALSE;
      imm32 = ZeroExtend(i:imm3:imm8, 32);
      if d IN {13,15} then UNPREDICTABLE;
- id: ADD_register
  mnemonic: ADD
  encodings:
  - name: T1
    length_bits: 16
    pattern: 0001100xxxxxxxxx
    bit_fields:
    - skip: 7
    - field: Rm
      width: 3
    - field: Rn
      width: 3
    - field: Rd
      width: 3
    decode: |
      d = UInt(Rd); n = UInt(Rn); m = UInt(Rm); setflags = !InITBlock();
      (shift_t, shift_n) = (SRType_LSL, 0);
  - name: T2
    length_bits: 16
    pattern: 01000100xxxxxxxx
    bit_fields:
    - skip: 8
    - field: DN
      width: 1
    - field: Rm
      width: 4
    - field: Rdn
      width: 3
    decode: |
      if (DN:Rdn) == '1101' || Rm == '1101' then SEE ADD (SP plus register);
      d = UInt(DN:Rdn); n = UInt(DN:Rdn); m = UInt(Rm); setflags = FALSE;
      (shift_t, shift_n) = (SRType_LSL, 0);
      if d == 15 && InITBlock() && !LastInITBlock() then UNPREDICTABLE;
      if d == 15 && m == 15 then UNPREDICTABLE;
  - name: T3
    length_bits: 32
    pattern: 11101011000xxxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 11
    - field: S
      width: 1
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm2
      width: 2
    - field: type
      width: 2
    - field: Rm
      width: 4
    decode: |
      if Rd == '1111' && S == '1' then SEE CMN (register);
      if Rn == '1101' then SEE ADD (SP plus register);
      d = UInt(Rd); n = UInt(Rn); m = UInt(Rm); setflags = (S == '1');
      (shift_t, shift_n) = DecodeImmShift(type, imm3:imm2);
      if d == 13 || (d == 15 && S == '0') || n == 15 || m IN {13,15} then UNPREDICTABLE;
- id: ADD_SP_plus_immediate
  mnemonic: ADD
  encodings:
  - name: T1
    length_bits: 16
    pattern: 10101xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rd
      width: 3
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); setflags = FALSE; imm32 = ZeroExtend(imm8:'00', 32);
  - name: T2
    length_bits: 16
    pattern: 101100000xxxxxxx
    bit_fields:
    - skip: 9
    - field: imm7
      width: 7
    decode: |
      d = 13; setflags = FALSE; imm32 = ZeroExtend(imm7:'00', 32);
  - name: T3
    length_bits: 32
    pattern: 11110x01000x11010xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 5
    - field: S
      width: 1
    - skip: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      if Rd == '1111' && S == '1' then SEE CMN (immediate);
      d = UInt(Rd); setflags = (S == '1'); imm32 = ThumbExpandImm(i:imm3:imm8);
      if d == 15 && S == '0' then UNPREDICTABLE;
  - name: T4
    length_bits: 32
    pattern: 11110x10000011010xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 6
    - skip: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); setflags = FALSE; imm32 = ZeroExtend(i:imm3:imm8, 32);
      if d == 15 then UNPREDICTABLE;
- id: ADD_SP_plus_register
  mnemonic: ADD
  encodings:
  - name: T1
    length_bits: 16
    pattern: 01000100x1101xxx
    bit_fields:
    - skip: 8
    - field: DM
      width: 1
    - skip: 4
    - field: Rdm
      width: 3
    decode: |
      d = UInt(DM:Rdm); m = UInt(DM:Rdm); setflags = FALSE;
      if d == 15 && InITBlock() && !LastInITBlock() then UNPREDICTABLE;
      (shift_t, shift_n) = (SRType_LSL, 0);
  - name: T2
    length_bits: 16
    pattern: 010001001xxxx101
    bit_fields:
    - skip: 9
    - field: Rm
      width: 4
    - skip: 3
    decode: |
      if Rm == '1101' then SEE encoding T1;
      d = 13; m = UInt(Rm); setflags = FALSE;
      (shift_t, shift_n) = (SRType_LSL, 0);
  - name: T3
    length_bits: 32
    pattern: 11101011000x11010xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 11
    - field: S
      width: 1
    - skip: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm2
      width: 2
    - field: type
      width: 2
    - field: Rm
      width: 4
    decode: |
      if Rd == '1111' && S == '1' then SEE CMN (register);
      d = UInt(Rd); m = UInt(Rm); setflags = (S == '1');
      (shift_t, shift_n) = DecodeImmShift(type, imm3:imm2);
      if d == 13 && (shift_t != SRType_LSL || shift_n > 3) then UNPREDICTABLE;
      if (d == 15 && S == '0') || m IN {13,15} then UNPREDICTABLE;
- id: ADR
  mnemonic: ADR
  encodings:
  - name: T1
    length_bits: 16
    pattern: 10100xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rd
      width: 3
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); imm32 = ZeroExtend(imm8:'00', 32); add = TRUE;
  - name: T2
    length_bits: 32
    pattern: 11110x10101011110xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 6
    - skip: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); imm32 = ZeroExtend(i:imm3:imm8, 32); add = FALSE;
      if d IN {13,15} then UNPREDICTABLE;
  - name: T3
    length_bits: 32
    pattern: 11110x10000011110xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 6
    - skip: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rd); imm32 = ZeroExtend(i:imm3:imm8, 32); add = TRUE;
      if d IN {13,15} then UNPREDICTABLE;
- id: SUB_immediate
  mnemonic: SUB
  encodings:
  - name: T1
    length_bits: 16
    pattern: 0001111xxxxxxxxx
    bit_fields:
    - skip: 7
    - field: imm3
      width: 3
    - field: Rn
