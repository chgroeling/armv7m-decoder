      width: 1
    - skip: 1
    - field: Rn
      width: 4
    - field: Vd
      width: 4
    - skip: 4
    - field: imm8
      width: 8
    decode: |
      if P == '0' && U == '0' && W == '0' then SEE "Related encodings";
      if P == '1' && U == '0' && W == '1' && Rn == '1101' then SEE VPUSH;
      if P == '1' && W == '0' then SEE VSTR;
      if P == U && W == '1' then UNDEFINED;
