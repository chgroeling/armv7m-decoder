    decode: |
      d = UInt(Rd); n = UInt(Rn); setflags = !InITBlock();
      imm32 = ZeroExtend(imm3, 32);
  - name: T2
    length_bits: 16
    pattern: 00111xxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: Rdn
      width: 3
    - field: imm8
      width: 8
    decode: |
      d = UInt(Rdn); n = UInt(Rdn); setflags = !InITBlock();
      imm32 = ZeroExtend(imm8, 32);
  - name: T3
    length_bits: 32
    pattern: 11110x01101xxxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 5
    - field: S
      width: 1
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      if Rd == '1111' && S == '1' then SEE CMP (immediate);
      if Rn == '1101' then SEE SUB (SP minus immediate);
      d = UInt(Rd); n = UInt(Rn); setflags = (S == '1');
      imm32 = ThumbExpandImm(i:imm3:imm8);
      if d == 13 || (d == 15 && S == '0') || n == 15 then UNPREDICTABLE;
  - name: T4
    length_bits: 32
    pattern: 11110x101010xxxx0xxxxxxxxxxxxxxx
    bit_fields:
    - skip: 5
    - field: i
      width: 1
    - skip: 6
    - field: Rn
      width: 4
    - skip: 1
    - field: imm3
      width: 3
    - field: Rd
      width: 4
    - field: imm8
      width: 8
    decode: |
      if Rn == '1111' then SEE ADR;
      if Rn == '1101' then SEE SUB (SP minus immediate);
      d = UInt(Rd); n = UInt(Rn); setflags = FALSE;
      imm32 = ZeroExtend(i:imm3:imm8, 32);
      if d IN {13,15} then UNPREDICTABLE;
